name: dataset-preparation

on:
  pull_request:
    paths: ["dataset_preparation/**", ".github/workflows/dataset-preparation.yml"]
  push:
    branches: [master]
    paths: ["dataset_preparation/**", ".github/workflows/dataset-preparation.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12 .prep-venv
      - name: Install CPU Torch
        run: uv pip install --python .prep-venv/bin/python torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install isolated preparation dependencies
        run: uv pip install --python .prep-venv/bin/python -r dataset_preparation/requirements.txt pytest ruff
      - name: Check standalone preparation scripts
        run: |
          .prep-venv/bin/ruff check dataset_preparation
          .prep-venv/bin/ruff format --check dataset_preparation
          .prep-venv/bin/python -m pytest --noconftest dataset_preparation/tests -q
