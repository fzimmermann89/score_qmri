[project]
name = "mri-diffusion"
version = "0.1.0"
description = "MRI diffusion"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.20.0",
    "lightning>=2.0.0",
    "jsonargparse[signatures]>=4.27.0",
    "h5py>=3.8.0",
    "numpy>=1.24.0",
    "wandb>=0.15.0",
    "pytorch-msssim>=1.0.0",
    "einops>=0.7.0",
    "kornia>=0.7.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.1.0", "mypy>=1.5.0", "pytest>=7.0.0", "pytest-cov>=4.0.0", "pre-commit>=3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument (common in abstract methods)
    "ARG002", # unused method argument (common in abstract methods)
    "ARG005", # unused lambda argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
exclude = ["\\.venv/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "pytorch_msssim.*",
    "_pytest.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["datasets", "models", "training", "sampling"]
