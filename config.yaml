model:
  base_channels: 64
  num_res_blocks: 2
  channel_mult:
    - 1
    - 2
    - 4
    - 8
    - 16

data:
  class_path: score_qmri.datasets.lightning.MRIDataModule
  init_args:
    dataset_configs:
      - type: complex
        h5_path: ./datasets/fastmri_t1.h5
        mode: coilwise
        kind: COMPLEX_T1W_COILWISE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_t1.h5
        mode: combined
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_t2.h5
        mode: coilwise
        kind: COMPLEX_T2W_COILWISE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_t2.h5
        mode: combined
        kind: COMPLEX_T2W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_flair.h5
        mode: coilwise
        kind: COMPLEX_FLAIR_COILWISE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_flair.h5
        mode: combined
        kind: COMPLEX_FLAIR_COIL_COMBINED
        augmentation_config:
          scale_range: [0.7, 0.9]

      # - type: complex
      #   h5_path: ./datasets/cc.h5
      #   mode: coilwise
      #   kind: COMPLEX_T1W_COILWISE
      #   augmentation_config:
      #     scale_range: [1.0, 1.2]

      - type: complex
        h5_path: ./datasets/cc.h5
        mode: combined
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: complex
        h5_path: ./datasets/m4raw_gre.h5
        mode: flat
        kind: COMPLEX_T1W_COIL_COMBINED

      - type: complex
        h5_path: ./datasets/m4raw_t1w.h5
        mode: flat
        kind: COMPLEX_T1W_COIL_COMBINED

      - type: complex
        h5_path: ./datasets/m4raw_t2w.h5
        mode: flat
        kind: COMPLEX_T2W_COIL_COMBINED

      - type: complex
        h5_path: ./datasets/m4raw_flair.h5
        mode: flat
        kind: COMPLEX_FLAIR_COIL_COMBINED

      - type: complex
        h5_path: ./datasets/ds000221_gre.h5
        mode: flat
        kind: M0_COMPLEX

      - type: complex
        h5_path: ./datasets/delics_complexm0.h5
        mode: flat
        kind: M0_COMPLEX

      - type: magnitude
        h5_path: ./datasets/ds000221_mprage.h5
        kind: T1W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ds004611_mprage.h5
        kind: T1W_MAGNITUDE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: magnitude
        h5_path: ./datasets/ds000221_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 0.7

      - type: magnitude
        h5_path: ./datasets/ds004611_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 0.7
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: magnitude
        h5_path: ./datasets/ds002685_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.3

      - type: magnitude
        h5_path: ./datasets/ds002785_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.8
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds002790_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.6

      - type: magnitude
        h5_path: ./datasets/ds004889_t1w.h5
        kind: T1W_MAGNITUDE
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: magnitude
        h5_path: ./datasets/mrf_zenodo8183344_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.2
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds000221_t2w.h5
        kind: T2W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ds002685_t2w.h5
        kind: T2W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/mrf_zenodo8183344_t2w.h5
        kind: T2W_MAGNITUDE
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds000221_flair.h5
        kind: FLAIR_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ds002685_flair.h5
        kind: FLAIR_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ds004889_flair.h5
        kind: FLAIR_MAGNITUDE
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/ds000221_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/ds004611_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: mapping
        h5_path: ./datasets/ds003967_t1map_cropped.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [0.5, 0.8]

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/mrf_zenodo8183344_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: mapping
        h5_path: ./datasets/mrf_nist_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/quiero_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.3]

      - type: mapping
        h5_path: ./datasets/delics_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/ds004611_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/mrf_zenodo8183344_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: mapping
        h5_path: ./datasets/mrf_nist_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/quiero_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.3]

      - type: mapping
        h5_path: ./datasets/delics_t2map.h5
        kind: T2MAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_s0map_t2.h5
        kind: M0_MAGNITUDE
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t2starmap.h5
        kind: T2STARMAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_m0map.h5
        kind: M0_MAGNITUDE
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: ./datasets/quiero_m0map.h5
        kind: M0_MAGNITUDE
        scaling_factor: 0.00005
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.3]

      - type: mapping
        h5_path: ./datasets/mrf_nist_m0map.h5
        kind: M0_MAGNITUDE
        schedule:
          type: phase_in
          steps: 50000
        augmentation_config:
          scale_range: [1.0, 1.2]

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_s0map.h5
        kind: M0_MAGNITUDE
        schedule:
          type: phase_in
          steps: 50000

    batch_size: 64
    sample_size: [256, 256]
    num_workers: 64
    base_seed: 42

trainer:
  max_steps: 500000
  gradient_clip_val: 0.5
  precision: 16-mixed
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: score_qmri
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 3
        monitor: train/loss
        mode: min
        save_last: true
