memory_budget: 0.99
model:
  attention_levels: [-1, -2]
  learning_rate: 1.2e-4

data:
  class_path: score_qmri.datasets.lightning.MRIDataModule
  init_args:
    dataset_configs:
      - type: complex
        h5_path: ./datasets/fastmri_t1.h5
        mode: coilwise
        kind: COMPLEX_T1W_COILWISE
        augmentation_config:
          scale_range: [0.65, 0.8]
        scaling_factor: 0.9

      - type: complex
        h5_path: ./datasets/fastmri_t1.h5
        mode: combined
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.65, 0.8]

      - type: complex
        h5_path: ./datasets/fastmri_t2.h5
        mode: coilwise
        kind: COMPLEX_T2W_COILWISE
        augmentation_config:
          scale_range: [0.65, 0.8]

      - type: complex
        h5_path: ./datasets/fastmri_t2.h5
        mode: combined
        kind: COMPLEX_T2W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.65, 0.8]

      - type: complex
        h5_path: ./datasets/fastmri_flair.h5
        mode: coilwise
        kind: COMPLEX_FLAIR_COILWISE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/fastmri_flair.h5
        mode: combined
        kind: COMPLEX_FLAIR_COIL_COMBINED
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: complex
        h5_path: ./datasets/cc.h5
        mode: coilwise
        kind: COMPLEX_T1W_COILWISE
        augmentation_config:
          scale_range: [0.95, 1.15]

      - type: complex
        h5_path: ./datasets/cc.h5
        mode: combined
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.95, 1.15]

      - type: complex
        h5_path: ./datasets/m4raw_gre.h5
        mode: flat
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.8, 1.1]

      - type: complex
        h5_path: ./datasets/m4raw_t1w.h5
        mode: flat
        kind: COMPLEX_T1W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.8, 1.1]

      - type: complex
        h5_path: ./datasets/m4raw_t2w.h5
        mode: flat
        kind: COMPLEX_T2W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.8, 1.1]

      - type: complex
        h5_path: ./datasets/m4raw_flair.h5
        mode: flat
        kind: COMPLEX_FLAIR_COIL_COMBINED
        augmentation_config:
          scale_range: [0.8, 1.1]

      - type: complex
        h5_path: ./datasets/ds000221_gre.h5
        mode: flat
        kind: M0_COMPLEX
        scaling_factor: 2.5
        augmentation_config:
          scale_range: [0.8, 0.95]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5
        schedule:
          type: constant
          weight: 0.05

      - type: complex
        h5_path: ./datasets/delics_complexm0.h5
        mode: flat
        kind: M0_COMPLEX
        scaling_factor: 1.6
        augmentation_config:
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: magnitude
        h5_path: ./datasets/ds000221_mprage.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.2
        schedule:
          type: constant
          weight: 0.2


      - type: magnitude
        h5_path: ./datasets/ds004611_mprage.h5
        kind: T1W_MAGNITUDE
        augmentation_config:
          scale_range: [0.8, 1.0]
        scaling_factor: 1.2

      - type: magnitude
        h5_path: ./datasets/ds000221_t1w.h5
        kind: T1W_MAGNITUDE
        schedule:
          type: constant
          weight: 0.3

      - type: magnitude
        h5_path: ./datasets/ds004611_t1w.h5
        kind: T1W_MAGNITUDE
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: magnitude
        h5_path: ./datasets/ds002685_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.3

      - type: magnitude
        h5_path: ./datasets/ds002785_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.8
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds002790_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.6
        augmentation_config:
          scale_range: [0.9, 1.2]
        schedule:
          type: constant
          weight: 0.5

      - type: magnitude
        h5_path: ./datasets/ds004889_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.3

      - type: magnitude
        h5_path: ./datasets/mrf_zenodo8183344_t1w.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 1.2
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds000221_t2w.h5
        schedule:
          type: constant
          weight: 0.3
        scaling_factor: 1.2
        kind: T2W_MAGNITUDE
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds002685_t2w.h5
        scaling_factor: 1.2
        kind: T2W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/mrf_zenodo8183344_t2w.h5
        kind: T2W_MAGNITUDE
        scaling_factor: 1.2
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: magnitude
        h5_path: ./datasets/ds000221_flair.h5
        kind: FLAIR_MAGNITUDE
        scaling_factor: 1.4
        augmentation_config:
          scale_range: [0.8, 1.0]

      - type: magnitude
        h5_path: ./datasets/ds002685_flair.h5
        kind: FLAIR_MAGNITUDE
        scaling_factor: 1.4
        augmentation_config:
          scale_range: [0.65, 0.95]

      - type: magnitude
        h5_path: ./datasets/ds004889_flair.h5
        kind: FLAIR_MAGNITUDE
        augmentation_config:
          scale_range: [1.0, 1.2]
        scaling_factor: 1.2

      - type: mapping
        h5_path: ./datasets/ds000221_t1map.h5
        schedule:
          type: constant
          weight: 0.3
        kind: T1MAP
        augmentation_config:
          scale_range: [0.8, 1.15]

      - type: mapping
        h5_path: ./datasets/ds004611_t1map.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: mapping
        h5_path: ./datasets/ds003967_t1map_cropped.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [0.65, 0.9]
        penumbra_width: -1
        schedule:
          type: constant
          weight: 0.1

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t1map.h5
        kind: T1MAP

      - type: mapping
        h5_path: ./datasets/mrf_zenodo8183344_t1map.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: mapping
        h5_path: ./datasets/mrf_nist_t1map.h5
        kind: T1MAP
        schedule:
          type: constant
          weight: 5.0
        augmentation_config:
          scale_range: [0.9, 1.15]

      - type: mapping
        h5_path: ./datasets/quiero_t1map.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [1.0, 1.3]
        schedule:
          type: constant
          weight: .5

      - type: mapping
        h5_path: ./datasets/delics_t1map.h5
        kind: T1MAP
        schedule:
          type: constant
          weight: 5.0

      - type: mapping
        h5_path: ./datasets/ds004611_t2map.h5
        kind: T2MAP
        augmentation_config:
          scale_range: [0.7, 0.9]

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t2map.h5
        kind: T2MAP

      - type: mapping
        h5_path: ./datasets/mrf_zenodo8183344_t2map.h5
        kind: T2MAP
        augmentation_config:
          scale_range: [0.9, 1.2]

      - type: mapping
        h5_path: ./datasets/mrf_nist_t2map.h5
        kind: T2MAP
        augmentation_config:
            scale_range: [0.9, 1.15]
        schedule:
          type: constant
          weight: 5.0

      - type: mapping
        h5_path: ./datasets/quiero_t2map.h5
        kind: T2MAP
        augmentation_config:
          scale_range: [1.0, 1.3]
        schedule:
          type: constant
          weight: .5

      - type: mapping
        h5_path: ./datasets/delics_t2map.h5
        kind: T2MAP
        schedule:
          type: constant
          weight: 5.0

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_s0map_t2.h5
        kind: M0_MAGNITUDE
        scaling_factor: 0.7
        augmentation_config:
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5
          scale_range: [0.8, 1.05]
        schedule:

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_t2starmap.h5
        kind: T2STARMAP

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_m0map.h5
        kind: M0_MAGNITUDE
        scaling_factor: 0.8
        augmentation_config:
          intensity_scale_range: [0.5, 1.3]
          scale_range: [0.8, 1.05]
          intensity_scale_prob: 0.5

      - type: mapping
        h5_path: ./datasets/quiero_m0map.h5
        kind: M0_MAGNITUDE
        scaling_factor: 0.8
        augmentation_config:
          scale_range: [1.0, 1.3]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: mapping
        h5_path: ./datasets/mrf_nist_m0map.h5
        kind: M0_MAGNITUDE
        scaling_factor: 1.8
        augmentation_config:
          scale_range: [0.9, 1.15]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: mapping
        h5_path: ./datasets/ibc_relaxo_s0map.h5
        kind: M0_MAGNITUDE
        scaling_factor: 1
        augmentation_config:
          scale_range: [0.85, 1.1]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: magnitude
        h5_path: ./datasets/ixi_t1w.h5
        kind: T1W_MAGNITUDE


      - type: magnitude
        h5_path: ./datasets/ixi_t2w.h5
        kind: T2W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ixi_pd.h5
        kind: M0_MAGNITUDE
        schedule:
          type: constant
          weight: 0.1
        augmentation_config:
          scale_range: [0.8, 1.1]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: mapping
        h5_path: ./datasets/radunsky_m0mag.h5
        kind: M0_MAGNITUDE
        augmentation_config:
          scale_range: [0.85, 1.15]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: mapping
        h5_path: ./datasets/radunsky_t1.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [0.85, 1.1]

      - type: mapping
        h5_path: ./datasets/radunsky_t2.h5
        kind: T2MAP
        augmentation_config:
          scale_range: [0.85, 1.1]

      - type: mapping
        h5_path: ./datasets/radunsky_t2star.h5
        kind: T2STARMAP

      - type: magnitude
        h5_path: ./datasets/ulf_t1.h5
        kind: T1W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ulf_t2.h5
        kind: T2W_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ulf_flair.h5
        kind: FLAIR_MAGNITUDE

      - type: magnitude
        h5_path: ./datasets/ldm_t1w.h5
        kind: T1W_MAGNITUDE
        augmentation_config:
          scale_range: [0.9, 1.3]

      - type: brainweb
        h5_path:  ./datasets/brainweb.h5
        kind: T1MAP
        augmentation_config:
          scale_range: [0.45, 0.6]

      - type: brainweb
        h5_path:  ./datasets/brainweb.h5
        kind: T2MAP
        augmentation_config:
          scale_range: [0.45, 0.6]

      - type: brainweb
        h5_path:  ./datasets/brainweb.h5
        kind: M0_COMPLEX
        augmentation_config:
          scale_range: [0.45, 0.6]
          intensity_scale_range: [0.5, 1.3]
          intensity_scale_prob: 0.5

      - type: brainweb_qualitative_magnitude
        h5_path:  ./datasets/brainweb.h5
        kind: T1W_MAGNITUDE
        scaling_factor: 10.
        augmentation_config:
          scale_range: [0.45, 0.6]

      - type: brainweb_qualitative_magnitude
        h5_path:  ./datasets/brainweb.h5
        kind: T2W_MAGNITUDE
        augmentation_config:
          scale_range: [0.45, 0.6]

      - type: brainweb_qualitative_complex
        h5_path:  ./datasets/brainweb.h5
        kind: COMPLEX_T1W_COIL_COMBINED
        scaling_factor: 10.
        augmentation_config:
          scale_range: [0.45, 0.6]

      - type: brainweb_qualitative_complex
        h5_path:  ./datasets/brainweb.h5
        kind: COMPLEX_T2W_COIL_COMBINED
        augmentation_config:
          scale_range: [0.45, 0.6]
    batch_size: 128
    sample_size: [256, 256]
    base_seed: 42
    kind_normalization: 0.5

trainer:
  max_steps: 1000000
  gradient_clip_val: 1.0
