    batch_size: 8
    num_workers: 4
    base_seed: 42

trainer:
  max_steps: 100000
  accelerator: auto
  devices: auto
  precision: 16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  enable_checkpointing: true
  enable_progress_bar: true

