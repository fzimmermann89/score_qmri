job_name: full_mri_training
experiment: multi_dataset_diffusion
wandb_project: mri-diffusion
wandb_entity: null
checkpoint_dir: checkpoints
ckpt_path: null

data:
  class_path: score_qmri.datasets.lightning.MRIDataModule
  init_args:
    dataset_configs:
      # FastMRI T1 - coilwise
      - type: complex
        h5_path: /home/zimmer08/datacheck/data/prepared/fastmri_t1.h5
        mode: coilwise
        kind: COMPLEX_T1W_COILWISE

      # FastMRI T1 - combined
      - type: complex
        h5_path: /home/zimmer08/datacheck/data/prepared/fastmri_t1.h5
        mode: combined
        kind: COMPLEX_T1W_COIL_COMBINED

      # FastMRI T2 - coilwise
      - type: complex
        h5_path: /home/zimmer08/datacheck/data/prepared/fastmri_t2.h5
        mode: coilwise
        kind: COMPLEX_T2W_COILWISE

      # FastMRI T2 - combined
      - type: complex
        h5_path: /home/zimmer08/datacheck/data/prepared/fastmri_t2.h5
