      - type: mapping
        h5_path: /home/zimmer08/datacheck/data/prepared/ds000221_t1map.h5
        kind: T1MAP
        schedule:
          type: phase_in
          steps: 50000

      - type: mapping
        h5_path: /home/zimmer08/datacheck/data/prepared/ds004611_t1map.h5
