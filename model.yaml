memory_budget: 0.99

trainer:
  precision: 32-true

data:
  init_args:
    batch_size: 128

model:
  unet:
    class_path: score_qmri.models.unet.UNet
    init_args:
      in_channels: 2
      base_channels: 96
      num_res_blocks: 2
      channel_mult: [1, 1, 2, 2, 4, 4]
      attention_levels: [-1, -2, -3]
  diffusion:
    low_noise_fraction: 0.1
    low_noise_max: 0.05
    normalization:
      kind_scales:
        T1MAP: 0.25
        T2MAP: 2
        T2STARMAP: 8
  learning_rate: 0.8e-4
  weight_decay: 0.02
  aux_weight: 0.0
  cond_dropout_rate: 0.2
  ema_decay: 0.999
